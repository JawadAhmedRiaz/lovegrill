[build]
  command = "npm run build"
  publish = "dist"

# Serve the CMS dashboard at /admin/
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# SPA fallback — all routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
